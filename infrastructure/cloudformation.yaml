AWSTemplateFormatVersion: "2010-09-09"
Description: Interview Share Canvas on a single EC2 host with durable EBS storage.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: Environment this stack instance represents.
  RepositoryName:
    Type: String
    Default: interview-share-canvas-app
    Description: Shared ECR repository owned by the registry stack.
  ImageTag:
    Type: String
    Default: latest
    AllowedPattern: "^[A-Za-z0-9_.-]{1,128}$"
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Must be the Availability Zone containing SubnetId.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
  DataVolumeSize:
    Type: Number
    Default: 10
    MinValue: 8
    MaxValue: 1024
  AllowedHttpCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$"
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP access to Interview Share Canvas
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Application HTTP traffic
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedHttpCidr
      SecurityGroupEgress:
        - Description: Package, ECR, and Systems Manager access
          IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-app

  ApplicationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: PullApplicationImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}

  ApplicationInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ApplicationRole

  ApplicationDataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Encrypted: true
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-data
        - Key: Environment
          Value: !Ref EnvironmentName

  ApplicationInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref ApplicationInstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref ApplicationSecurityGroup
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 12
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-app
        - Key: Environment
          Value: !Ref EnvironmentName
        # Records the image this host was last deployed with. It also keeps
        # ImageTag affecting a real resource: without this the parameter changes
        # produce an empty changeset, the stack update is skipped, and the stored
        # ImageTag silently goes stale while the host runs something else.
        - Key: DeployedImageTag
          Value: !Ref ImageTag
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf install -y docker xfsprogs
          systemctl enable --now docker

          COMPOSE_VERSION=v5.5.0
          COMPOSE_PLUGIN_DIRECTORY=/usr/libexec/docker/cli-plugins
          COMPOSE_ASSET=docker-compose-linux-x86_64
          COMPOSE_RELEASE_URL=https://github.com/docker/compose/releases/download/$COMPOSE_VERSION
          mkdir -p "$COMPOSE_PLUGIN_DIRECTORY"
          cd /tmp
          curl --fail --silent --show-error --location --output "$COMPOSE_ASSET" "$COMPOSE_RELEASE_URL/$COMPOSE_ASSET"
          curl --fail --silent --show-error --location --output "$COMPOSE_ASSET.sha256" "$COMPOSE_RELEASE_URL/$COMPOSE_ASSET.sha256"
          sha256sum --check "$COMPOSE_ASSET.sha256"
          install --mode 0755 "$COMPOSE_ASSET" "$COMPOSE_PLUGIN_DIRECTORY/docker-compose"
          rm --force "$COMPOSE_ASSET" "$COMPOSE_ASSET.sha256"
          docker compose version

          DATA_VOLUME_SERIAL="${ApplicationDataVolume}"
          DATA_VOLUME_SERIAL=$(echo "$DATA_VOLUME_SERIAL" | tr -d '-')
          DATA_DEVICE=""
          for attempt in $(seq 1 60); do
            DATA_DEVICE=$(lsblk --nodeps --noheadings --output NAME,SERIAL | awk -v serial="$DATA_VOLUME_SERIAL" '$2 == serial {print "/dev/" $1}')
            if [ -n "$DATA_DEVICE" ]; then
              break
            fi
            sleep 2
          done
          test -b "$DATA_DEVICE"

          if ! blkid "$DATA_DEVICE"; then
            mkfs.xfs "$DATA_DEVICE"
          fi
          DATA_UUID=$(blkid -s UUID -o value "$DATA_DEVICE")
          mkdir -p /data
          if ! grep -q "UUID=$DATA_UUID" /etc/fstab; then
            echo "UUID=$DATA_UUID /data xfs defaults,nofail 0 2" >> /etc/fstab
          fi
          mountpoint --quiet /data || mount /data

          mkdir -p /data/postgres
          mkdir -p /opt/interview-share-canvas

  ApplicationDataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref ApplicationInstance
      VolumeId: !Ref ApplicationDataVolume

  ApplicationElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref ApplicationInstance
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-app

Outputs:
  ApplicationUrl:
    Description: Public application URL.
    Value: !Sub http://${ApplicationElasticIp}
  HealthCheckUrl:
    Value: !Sub http://${ApplicationElasticIp}/health
  InstanceId:
    Description: Connect through AWS Systems Manager Session Manager.
    Value: !Ref ApplicationInstance
  DataVolumeId:
    Value: !Ref ApplicationDataVolume
