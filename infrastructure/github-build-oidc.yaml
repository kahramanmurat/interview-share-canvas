AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions role that may publish container images and nothing else.

Parameters:
  RoleName:
    Type: String
    Default: interview-share-canvas-build
  OidcSubject:
    Type: String
    Description: The exact sub claim observed from a live token. Never construct this by hand.
  RepositoryName:
    Type: String
    Default: interview-share-canvas-app

Resources:
  GitHubBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref OidcSubject
      Policies:
        - PolicyName: PublishApplicationImages
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AuthenticateToEcr
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PublishApplicationImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}

Outputs:
  BuildRoleArn:
    Description: Role assumed by the build stage. It cannot deploy.
    Value: !GetAtt GitHubBuildRole.Arn
