AWSTemplateFormatVersion: "2010-09-09"
Description: The Interview Share Canvas observability host, separate from every application environment.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Must be the Availability Zone containing SubnetId.
  AllowedOtlpCidr:
    Type: String
    Description: >-
      Who may send telemetry. Defaults to nothing; the deploy script passes the
      VPC's own CIDR so the application hosts can reach the collector and the
      internet cannot.
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$"
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
    Description: >-
      Five containers share this host. t3.micro is not enough memory for
      Prometheus, Loki, and Tempo at the same time.
  DataVolumeSize:
    Type: Number
    Default: 20
    MinValue: 8
    MaxValue: 1024
    Description: Telemetry outlives the instance on this volume.
  GrafanaPasswordParameter:
    Type: String
    Default: /interview-share-canvas/observability/grafana-admin-password
    Description: >-
      SecureString parameter holding the Grafana admin password. The host reads
      it itself, so the password never travels through a Systems Manager command.
  OtlpEndpointParameterName:
    Type: String
    Default: /interview-share-canvas/observability/otlp-endpoint
    Description: >-
      Where this stack publishes its collector address. Application hosts read
      this parameter, which is the whole connection between the two stacks.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  ObservabilitySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: OTLP ingest for Interview Share Canvas telemetry
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: OTLP over gRPC from inside the VPC
          IpProtocol: tcp
          FromPort: 4317
          ToPort: 4317
          CidrIp: !Ref AllowedOtlpCidr
        - Description: OTLP over HTTP from inside the VPC
          IpProtocol: tcp
          FromPort: 4318
          ToPort: 4318
          CidrIp: !Ref AllowedOtlpCidr
      # Grafana, Prometheus, Loki, and Tempo are deliberately absent. They bind
      # to the host's loopback address and are reached with a Systems Manager
      # port forwarding session, so no dashboard is exposed to the internet.
      SecurityGroupEgress:
        - Description: Container images, package updates, and Systems Manager
          IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}

  ObservabilityRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadGrafanaPassword
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GrafanaPasswordParameter}
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com

  ObservabilityInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ObservabilityRole

  ObservabilityDataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Encrypted: true
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-data

  ObservabilityInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref ObservabilityInstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref ObservabilitySecurityGroup
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 12
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}
        - Key: Role
          Value: observability
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf install -y docker xfsprogs
          systemctl enable --now docker

          COMPOSE_VERSION=v5.5.0
          COMPOSE_PLUGIN_DIRECTORY=/usr/libexec/docker/cli-plugins
          COMPOSE_ASSET=docker-compose-linux-x86_64
          COMPOSE_RELEASE_URL=https://github.com/docker/compose/releases/download/$COMPOSE_VERSION
          mkdir -p "$COMPOSE_PLUGIN_DIRECTORY"
          cd /tmp
          curl --fail --silent --show-error --location --output "$COMPOSE_ASSET" "$COMPOSE_RELEASE_URL/$COMPOSE_ASSET"
          curl --fail --silent --show-error --location --output "$COMPOSE_ASSET.sha256" "$COMPOSE_RELEASE_URL/$COMPOSE_ASSET.sha256"
          sha256sum --check "$COMPOSE_ASSET.sha256"
          install --mode 0755 "$COMPOSE_ASSET" "$COMPOSE_PLUGIN_DIRECTORY/docker-compose"
          rm --force "$COMPOSE_ASSET" "$COMPOSE_ASSET.sha256"
          docker compose version

          DATA_VOLUME_SERIAL="${ObservabilityDataVolume}"
          DATA_VOLUME_SERIAL=$(echo "$DATA_VOLUME_SERIAL" | tr -d '-')
          DATA_DEVICE=""
          for attempt in $(seq 1 60); do
            DATA_DEVICE=$(lsblk --nodeps --noheadings --output NAME,SERIAL | awk -v serial="$DATA_VOLUME_SERIAL" '$2 == serial {print "/dev/" $1}')
            if [ -n "$DATA_DEVICE" ]; then
              break
            fi
            sleep 2
          done
          test -b "$DATA_DEVICE"

          if ! blkid "$DATA_DEVICE"; then
            mkfs.xfs "$DATA_DEVICE"
          fi
          DATA_UUID=$(blkid -s UUID -o value "$DATA_DEVICE")
          mkdir -p /data
          if ! grep -q "UUID=$DATA_UUID" /etc/fstab; then
            echo "UUID=$DATA_UUID /data xfs defaults,nofail 0 2" >> /etc/fstab
          fi
          mountpoint --quiet /data || mount /data

          mkdir -p /opt/interview-share-canvas-observability

  ObservabilityDataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref ObservabilityInstance
      VolumeId: !Ref ObservabilityDataVolume

  # The only thing the application stacks read from this one. Replacing the
  # instance rewrites it, so a redeployed application host picks up the new
  # address without either stack referencing the other.
  OtlpEndpointParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Ref OtlpEndpointParameterName
      Type: String
      Description: OTLP HTTP endpoint of the Interview Share Canvas collector.
      Value: !Sub http://${ObservabilityInstance.PrivateIp}:4318

Outputs:
  InstanceId:
    Description: Connect through AWS Systems Manager Session Manager.
    Value: !Ref ObservabilityInstance
  OtlpEndpoint:
    Description: What the application hosts export to.
    Value: !Sub http://${ObservabilityInstance.PrivateIp}:4318
  OtlpEndpointParameterName:
    Value: !Ref OtlpEndpointParameterName
  GrafanaTunnelCommand:
    Description: Run this, then open http://127.0.0.1:3000.
    Value: !Sub >-
      aws ssm start-session --region ${AWS::Region} --target ${ObservabilityInstance}
      --document-name AWS-StartPortForwardingSession
      --parameters '{"portNumber":["3000"],"localPortNumber":["3000"]}'
  DataVolumeId:
    Value: !Ref ObservabilityDataVolume
