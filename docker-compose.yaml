services:
  app:
    build: .
    image: ${APP_IMAGE:-interview-share-canvas:local}
    restart: ${RESTART_POLICY:-no}
    ports:
      - "${APP_PORT:-8091}:8091"
    environment:
      - DATABASE_URL=postgresql+psycopg://interview:interview@postgres:5432/interview_share_canvas
      - PUBLIC_BASE_URL
      # Identifies this deployment in telemetry. Unset locally, the backend
      # reports the environment as "local" and the version as "unknown".
      - ENVIRONMENT_NAME
      - IMAGE_TAG
      # Telemetry only exports when an endpoint is set.
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_HEADERS
      - OTEL_SERVICE_NAME
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm
    restart: ${RESTART_POLICY:-no}
    environment:
      POSTGRES_DB: interview_share_canvas
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview_share_canvas"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ${POSTGRES_DATA:-postgres-data}:/var/lib/postgresql/data

volumes:
  postgres-data:
