name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test

  compose-tests:
    name: Compose integration and E2E tests
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    env:
      APP_PORT: "18091"
      COMPOSE_PROJECT: interview-share-canvas-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm --prefix e2e ci
      - run: npm --prefix e2e exec -- playwright install --with-deps chromium
      - name: Build and start Docker Compose stack
        run: docker compose -p "$COMPOSE_PROJECT" up --build --detach --wait
      - name: Run integration tests
        env:
          APPLICATION_URL: http://127.0.0.1:18091
        run: node --test integration/stack.test.mjs
      - name: Run end-to-end tests against the running stack
        env:
          E2E_REUSE_COMPOSE: "1"
          E2E_COMPOSE_PROJECT: ${{ env.COMPOSE_PROJECT }}
        run: npm --prefix e2e test
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-diagnostics
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
      - name: Show Compose logs
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT" logs --no-color
      - name: Remove Compose stack
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT" down --volumes --remove-orphans

  deploy-dev:
    name: Deploy to dev
    if: github.event_name != 'pull_request'
    needs: compose-tests
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build, publish, and deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          STACK_NAME: ${{ vars.AWS_STACK_NAME }}
          ENVIRONMENT_NAME: dev
          REPOSITORY_NAME: ${{ vars.AWS_REPOSITORY_NAME }}
          CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
          PUBLISH_IMAGE: "true"
          IMAGE_TAG: ${{ github.sha }}
        run: ./scripts/deploy-aws.sh
      - name: Validate deployment health
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          STACK_NAME: ${{ vars.AWS_STACK_NAME }}
        run: |
          application_url=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApplicationUrl'].OutputValue | [0]" \
            --output text)
          curl --fail --show-error --silent --retry 12 --retry-all-errors \
            --retry-delay 5 "$application_url/health" | grep '"status":"ok"'

  deploy-prod:
    name: Deploy to production
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Promote the tested image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          STACK_NAME: ${{ vars.AWS_STACK_NAME }}
          ENVIRONMENT_NAME: prod
          REPOSITORY_NAME: ${{ vars.AWS_REPOSITORY_NAME }}
          CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
          PUBLISH_IMAGE: "false"
          IMAGE_TAG: ${{ github.sha }}
        run: ./scripts/deploy-aws.sh
      - name: Validate deployment health
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          STACK_NAME: ${{ vars.AWS_STACK_NAME }}
        run: |
          application_url=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApplicationUrl'].OutputValue | [0]" \
            --output text)
          curl --fail --show-error --silent --retry 12 --retry-all-errors \
            --retry-delay 5 "$application_url/health" | grep '"status":"ok"'
