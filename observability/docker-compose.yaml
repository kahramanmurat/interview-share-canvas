# A local observability backend for the telemetry the application exports.
#
# This is its own Compose project, started and stopped independently of the
# application stack, which reaches the collector over the host rather than over
# a shared Compose network. Either stack can run without the other: with no
# collector listening the application exports nothing, and the collector is
# happy to sit idle.
name: observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otel-collector/config.yaml:ro
    ports:
      # OTLP has to be reachable from the application's own Compose network, so
      # unlike the query ports below it is not bound to the loopback address.
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      # Tempo's metrics generator writes span metrics here.
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ${PROMETHEUS_DATA:-prometheus-data}:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  loki:
    image: grafana/loki:3.7.7
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - ${LOKI_DATA:-loki-data}:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"

  tempo:
    image: grafana/tempo:2.10.8
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - ${TEMPO_DATA:-tempo-data}:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    environment:
      # Anonymous administration is the local default, which is why every query
      # port above is bound to the loopback address. The deployed host sets
      # GRAFANA_ANONYMOUS=false and supplies an admin password instead.
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS:-true}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "${GRAFANA_ANONYMOUS:-true}"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      # Keeps startup offline: without this Grafana downloads bundled
      # plugins from the internet every time the volume is recreated.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ${GRAFANA_DATA:-grafana-data}:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
