# Single-binary Tempo on local disk. Only the collector writes to it, so it
# accepts OTLP over gRPC and nothing else.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

# Turns spans into RED metrics and a service graph, written to Prometheus, so
# request rate and latency per route come from the traces already being sent.
metrics_generator:
  processor:
    span_metrics:
      dimensions:
        - deployment.environment.name
        - service.version
    service_graphs:
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors:
        - span-metrics
        - service-graphs

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
